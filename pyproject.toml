[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-blunder-log"
version = "0.1.0"
description = "Python CLI to log chess blunders and lessons from FEN/PGN snippets, with local JSON storage and a review quiz."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "python-chess>=1.999",
]

[project.scripts]
chess-blunder-log = "chess_blunder_log.cli:main"

[tool.ruff]
line-length = 100
